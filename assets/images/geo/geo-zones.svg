<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="Arial, 'Microsoft YaHei', sans-serif">
  <rect width="720" height="470" fill="#ffffff"/>
  <text x="24" y="32" font-size="20" font-weight="bold" fill="#1f2937">五带划分 · 半球分界（自制示意）</text>
  <text x="24" y="54" font-size="13" fill="#6b7280">划分依据：各地获得太阳光热的多少，以及有无太阳直射、有无极昼极夜</text>

  <!-- 色带，纬度 180° 对应 360px -->
  <rect x="90" y="60" width="240" height="47" fill="#dbeafe" stroke="#94a3b8"/>
  <rect x="90" y="107" width="240" height="86" fill="#dcfce7" stroke="#94a3b8"/>
  <rect x="90" y="193" width="240" height="94" fill="#fecaca" stroke="#94a3b8"/>
  <rect x="90" y="287" width="240" height="86" fill="#dcfce7" stroke="#94a3b8"/>
  <rect x="90" y="373" width="240" height="47" fill="#dbeafe" stroke="#94a3b8"/>
  <line x1="90" y1="240" x2="330" y2="240" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>

  <g font-size="14" font-weight="bold" fill="#1f2937">
    <text x="108" y="90">北寒带</text><text x="108" y="155">北温带</text><text x="108" y="245">热　带</text>
    <text x="108" y="335">南温带</text><text x="108" y="402">南寒带</text>
  </g>
  <g font-size="12" fill="#475569" text-anchor="end">
    <text x="84" y="65">90°N</text><text x="84" y="112">66.5°N 北极圈</text><text x="84" y="198">23.5°N 北回归线</text>
    <text x="84" y="245" fill="#dc2626" font-weight="bold">0° 赤道</text><text x="84" y="292">23.5°S 南回归线</text>
    <text x="84" y="378">66.5°S 南极圈</text><text x="84" y="425">90°S</text>
  </g>

  <!-- 右侧特征表 -->
  <g font-size="13" fill="#1f2937">
    <rect x="360" y="60" width="336" height="360" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="376" y="86" font-size="15" font-weight="bold">各带特征（必背）</text>
    <text x="376" y="116">热带：有太阳直射，终年炎热，长夏无冬</text>
    <text x="376" y="142">南、北温带：无直射、无极昼极夜，四季明显</text>
    <text x="376" y="168">南、北寒带：有极昼极夜，终年寒冷</text>
    <line x1="376" y1="186" x2="680" y2="186" stroke="#e2e8f0"/>
    <text x="376" y="212" font-size="15" font-weight="bold">南北半球 / 东西半球</text>
    <text x="376" y="240">南北半球分界：赤道（0°纬线）</text>
    <text x="376" y="266">东西半球分界：20°W 与 160°E 组成的经线圈</text>
    <text x="376" y="292">口诀「小小为东、大大为西」：西经 &lt; 20°、东经 &lt; 160° 在东半球</text>
    <text x="376" y="318">中国位于东半球、北半球；南北美洲主要在西半球</text>
    <line x1="376" y1="336" x2="680" y2="336" stroke="#e2e8f0"/>
    <text x="376" y="362" font-size="15" font-weight="bold">低 / 中 / 高纬度</text>
    <text x="376" y="390">低纬 0°—30°　中纬 30°—60°　高纬 60°—90°</text>
    <text x="376" y="412" fill="#6b7280">厦门约 24.5°N，属低纬度、北温带、北半球、东半球。</text>
  </g>

  <text x="24" y="448" font-size="13" fill="#1f2937">太阳直射点只在南北回归线之间往返：回归线上一年直射 1 次，回归线之间一年直射 2 次，回归线以外无直射。</text>
</svg>
