<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="Arial, 'Microsoft YaHei', sans-serif">
  <rect width="720" height="480" fill="#ffffff"/>
  <text x="24" y="30" font-size="20" font-weight="bold" fill="#1f2937">等高线地形图 · 山体部位判读（自制示意）</text>
  <text x="24" y="52" font-size="13" fill="#6b7280">同一条等高线上各点海拔相等；相邻两条等高线的高差叫等高距；等高线一般不相交、不重叠</text>

  <g stroke="#cbd5e1" fill="#f8fafc">
    <rect x="24" y="68" width="216" height="166" rx="6"/><rect x="252" y="68" width="216" height="166" rx="6"/><rect x="480" y="68" width="216" height="166" rx="6"/>
    <rect x="24" y="246" width="216" height="166" rx="6"/><rect x="252" y="246" width="216" height="166" rx="6"/><rect x="480" y="246" width="216" height="166" rx="6"/>
  </g>

  <!-- 山顶 -->
  <g fill="none" stroke="#b45309" stroke-width="2">
    <ellipse cx="132" cy="148" rx="80" ry="56"/><ellipse cx="132" cy="148" rx="55" ry="38"/><ellipse cx="132" cy="148" rx="28" ry="19"/>
  </g>
  <g font-size="11" fill="#92400e"><text x="196" y="112">300</text><text x="178" y="132">400</text><text x="152" y="146">500</text></g>
  <text x="34" y="90" font-size="14" font-weight="bold" fill="#1f2937">① 山顶（峰）</text>
  <text x="34" y="222" font-size="12" fill="#475569">闭合曲线，数值中间高、四周低</text>

  <!-- 山脊：曲线向低处（下方）凸出 -->
  <g fill="none" stroke="#b45309" stroke-width="2">
    <path d="M 282 100 Q 360 170 452 100"/>
    <path d="M 282 126 Q 360 196 452 126"/>
    <path d="M 282 152 Q 360 222 452 152"/>
  </g>
  <g font-size="11" fill="#92400e"><text x="258" y="104">500</text><text x="258" y="130">400</text><text x="258" y="156">300</text></g>
  <line x1="360" y1="168" x2="360" y2="220" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="262" y="90" font-size="14" font-weight="bold" fill="#1f2937">② 山脊（上高下低）</text>
  <text x="262" y="230" font-size="11.5" fill="#475569">向海拔低处凸出，凸低为脊</text>

  <!-- 山谷：曲线向高处（上方）凸出 -->
  <g fill="none" stroke="#b45309" stroke-width="2">
    <path d="M 508 165 Q 588 75 668 165"/>
    <path d="M 508 191 Q 588 101 668 191"/>
    <path d="M 508 217 Q 588 127 668 217"/>
  </g>
  <g font-size="11" fill="#92400e"><text x="484" y="169">300</text><text x="484" y="195">400</text><text x="484" y="221">500</text></g>
  <path d="M 588 92 L 588 212" stroke="#0284c7" stroke-width="3"/>
  <path d="M 583 202 L 588 214 L 593 202 Z" fill="#0284c7"/>
  <text x="490" y="90" font-size="14" font-weight="bold" fill="#1f2937">③ 山谷（上低下高）</text>
  <text x="490" y="230" font-size="11.5" fill="#475569">向海拔高处凸出，凸高为谷，常发育河流</text>

  <!-- 鞍部 -->
  <g fill="none" stroke="#b45309" stroke-width="2">
    <ellipse cx="76" cy="326" rx="42" ry="32"/><ellipse cx="188" cy="326" rx="42" ry="32"/>
  </g>
  <path d="M 118 300 Q 132 326 118 352" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="112" y="290" font-size="12" fill="#2563eb">鞍部</text>
  <text x="34" y="268" font-size="14" font-weight="bold" fill="#1f2937">④ 鞍部</text>
  <text x="34" y="400" font-size="12" fill="#475569">相邻两个山顶之间的低地</text>

  <!-- 陡崖 -->
  <g stroke="#b45309" stroke-width="2.4">
    <line x1="276" y1="306" x2="444" y2="306"/><line x1="278" y1="311" x2="446" y2="311"/>
    <line x1="280" y1="316" x2="448" y2="316"/><line x1="282" y1="321" x2="450" y2="321"/>
  </g>
  <g stroke="#334155" stroke-width="1.4">
    <line x1="300" y1="306" x2="300" y2="350"/><line x1="330" y1="306" x2="330" y2="350"/>
    <line x1="360" y1="306" x2="360" y2="350"/><line x1="390" y1="306" x2="390" y2="350"/>
    <line x1="420" y1="306" x2="420" y2="350"/>
  </g>
  <text x="262" y="268" font-size="14" font-weight="bold" fill="#1f2937">⑤ 陡崖</text>
  <text x="262" y="400" font-size="12" fill="#475569">多条等高线重合，适合攀岩，可形成瀑布</text>

  <!-- 疏密 -->
  <g stroke="#b45309" stroke-width="2">
    <line x1="500" y1="296" x2="560" y2="296"/><line x1="500" y1="304" x2="560" y2="304"/>
    <line x1="500" y1="312" x2="560" y2="312"/><line x1="500" y1="320" x2="560" y2="320"/>
    <line x1="600" y1="296" x2="672" y2="296"/><line x1="600" y1="318" x2="672" y2="318"/>
    <line x1="600" y1="340" x2="672" y2="340"/><line x1="600" y1="362" x2="672" y2="362"/>
  </g>
  <text x="490" y="268" font-size="14" font-weight="bold" fill="#1f2937">⑥ 坡度陡缓</text>
  <text x="498" y="400" font-size="12" fill="#475569">左：密集→坡陡　　右：稀疏→坡缓</text>

  <text x="24" y="440" font-size="13" font-weight="bold" fill="#1f2937">口诀：凸高为谷（集水成河），凸低为脊（分水岭）；重合为崖，密陡疏缓。</text>
  <text x="24" y="462" font-size="12.5" fill="#475569">应用：爬山选缓坡（等高线稀疏），攀岩选陡崖，漂流选等高线密集的河段，水库坝址选「口袋形」洼地的峡谷最窄处。</text>
</svg>
