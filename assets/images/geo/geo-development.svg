<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" font-family="Arial, 'Microsoft YaHei', sans-serif">
<rect width="720" height="540" fill="#ffffff"/>
<text x="24" y="32" font-size="20" font-weight="bold" fill="#1f2937">发达国家与发展中国家 · 南北差异（自制示意）</text>
<text x="24" y="54" font-size="13" fill="#6b7280">按经济发展水平划分；发达国家多分布在北半球，发展中国家多在亚非拉；合作方式有「南北对话」与「南南合作」</text>
<defs>
<clipPath id="globe"><circle cx="380" cy="268" r="158"/></clipPath>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0f766e"/></marker>
<marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#0f766e"/></marker>
<marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/></marker>
</defs>
<circle cx="380" cy="268" r="158" fill="#dbeafe"/>
<rect x="222" y="268" width="316" height="158" fill="#fef3c7" clip-path="url(#globe)"/>
<circle cx="380" cy="268" r="158" fill="none" stroke="#475569" stroke-width="1.6"/>
<line x1="222" y1="268" x2="538" y2="268" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 5"/>
<text x="546" y="262" font-size="11.5" fill="#dc2626" font-weight="bold">赤道</text>
<text x="380" y="170" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">发达国家（「北」）</text>
<text x="380" y="192" font-size="12.5" fill="#1e40af" text-anchor="middle">欧洲西部 · 北美 · 日本 · 澳大利亚</text>
<text x="380" y="354" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">发展中国家（「南」）</text>
<text x="380" y="376" font-size="12.5" fill="#b45309" text-anchor="middle">亚洲 · 非洲 · 拉丁美洲（中国最大）</text>
<line x1="248" y1="212" x2="248" y2="324" stroke="#0f766e" stroke-width="2.4" marker-start="url(#ar2)" marker-end="url(#ar)"/>
<g transform="rotate(-90 233 268)">
<rect x="200" y="260" width="66" height="17" fill="#ffffff" opacity="0.95"/>
<text x="233" y="272" font-size="11.5" fill="#0f766e" text-anchor="middle">南北对话</text>
</g>
<path d="M 276 318 Q 380 300 484 318" fill="none" stroke="#b45309" stroke-width="2.4" marker-end="url(#ar3)"/>
<text x="380" y="294" font-size="12" fill="#b45309" text-anchor="middle">南南合作</text>
<text x="24" y="470" font-size="12.5" fill="#1f2937">差异表现：发达国家工业发达、农业机械化程度高、服务业比重大；发展中国家多以初级产品为主，经济水平较低</text>
<text x="24" y="496" font-size="12" fill="#92400e">说明：图中「北 / 南」是经济地理概念，不等于半球位置；发达国家也分布在南半球（如澳大利亚、新西兰）。</text>
</svg>
