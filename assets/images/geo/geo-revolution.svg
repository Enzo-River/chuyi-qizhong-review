<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="Arial, 'Microsoft YaHei', sans-serif">
  <rect width="720" height="470" fill="#ffffff"/>
  <text x="24" y="32" font-size="20" font-weight="bold" fill="#1f2937">地球公转 · 二分二至（自制示意）</text>
  <text x="24" y="54" font-size="13" fill="#6b7280">公转方向自西向东，周期约 1 年；地轴倾斜方向始终不变（图中各位置地轴平行）</text>

  <ellipse cx="360" cy="235" rx="270" ry="125" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 6"/>
  <!-- 公转方向箭头 -->
  <path d="M 360 110 A 270 125 0 0 0 300 112" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <path d="M 296 104 L 304 113 L 293 117 Z" fill="#7c3aed"/>
  <text x="366" y="100" font-size="12" fill="#7c3aed">公转方向（俯视逆时针）</text>

  <!-- 太阳 -->
  <circle cx="360" cy="235" r="34" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="241" font-size="14" font-weight="bold" fill="#7c2d12" text-anchor="middle">太阳</text>

  <!-- 四个位置：地轴统一向左上倾斜 -->
  <g stroke="#334155" stroke-width="2">
    <!-- 左：夏至 -->
    <line x1="78" y1="270" x2="102" y2="200"/>
    <!-- 上：秋分 -->
    <line x1="348" y1="140" x2="372" y2="70"/>
    <!-- 右：冬至 -->
    <line x1="618" y1="270" x2="642" y2="200"/>
    <!-- 下：春分 -->
    <line x1="348" y1="400" x2="372" y2="330"/>
  </g>
  <g fill="#3b82f6" stroke="#1d4ed8">
    <circle cx="90" cy="235" r="25"/><circle cx="360" cy="110" r="25"/>
    <circle cx="630" cy="235" r="25"/><circle cx="360" cy="360" r="25"/>
  </g>
  <g stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3">
    <line x1="90" y1="235" x2="360" y2="235"/>
    <line x1="360" y1="110" x2="360" y2="235"/>
    <line x1="630" y1="235" x2="360" y2="235"/>
    <line x1="360" y1="360" x2="360" y2="235"/>
  </g>

  <g font-size="13" fill="#1f2937" font-weight="bold">
    <text x="24" y="300">A　6 月 22 日前后 · 夏至</text>
    <text x="262" y="72">B　9 月 23 日前后 · 秋分</text>
    <text x="532" y="300">C　12 月 22 日前后 · 冬至</text>
    <text x="262" y="418">D　3 月 21 日前后 · 春分</text>
  </g>
  <g font-size="12" fill="#475569">
    <text x="24" y="320">直射北回归线 · 北半球昼最长</text>
    <text x="262" y="90">直射赤道 · 全球昼夜平分</text>
    <text x="532" y="320">直射南回归线 · 北半球昼最短</text>
    <text x="262" y="436">直射赤道 · 全球昼夜平分</text>
  </g>

  <!-- 底部速记 -->
  <rect x="24" y="446" width="672" height="1" fill="#e2e8f0"/>
  <text x="24" y="464" font-size="12" fill="#6b7280">自转（绕地轴、1 天）→ 昼夜更替、时差、日月星辰东升西落；公转（绕太阳、1 年）→ 四季更替、昼夜长短变化、五带划分。</text>
</svg>
