<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="Arial, 'Microsoft YaHei', sans-serif">
  <rect width="720" height="480" fill="#ffffff"/>
  <text x="24" y="30" font-size="20" font-weight="bold" fill="#1f2937">六大板块 · 张裂与挤压（自制示意）</text>
  <text x="24" y="52" font-size="13" fill="#b91c1c">⚠ 板块边界为示意，非真实边界；识图请以课本《六大板块分布示意图》为准</text>

  <g stroke="#475569" stroke-width="1.6">
    <rect x="60" y="80" width="150" height="240" fill="#fed7aa"/>
    <rect x="210" y="80" width="140" height="240" fill="#bfdbfe"/>
    <rect x="350" y="80" width="180" height="125" fill="#bbf7d0"/>
    <rect x="350" y="205" width="90" height="115" fill="#fef08a"/>
    <rect x="440" y="205" width="90" height="115" fill="#fbcfe8"/>
    <rect x="530" y="80" width="130" height="240" fill="#c7d2fe"/>
    <rect x="60" y="320" width="600" height="46" fill="#e2e8f0"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">
    <text x="135" y="200">美洲板块</text>
    <text x="280" y="200">太平洋板块</text>
    <text x="440" y="145">亚欧板块</text>
    <text x="395" y="265">非洲板块</text>
    <text x="485" y="265">印度洋板块</text>
    <text x="595" y="200">（太平洋板块</text><text x="595" y="220">也延伸至东侧）</text>
    <text x="360" y="348">南极洲板块</text>
  </g>
  <text x="530" y="90" font-size="11" fill="#6b7280">右侧为示意性延伸</text>

  <!-- 张裂 / 挤压箭头 -->
  <g stroke="#dc2626" stroke-width="2.5" fill="#dc2626">
    <line x1="196" y1="160" x2="222" y2="160"/><path d="M 196 155 L 188 160 L 196 165 Z"/>
    <line x1="340" y1="160" x2="366" y2="160"/><path d="M 366 155 L 374 160 L 366 165 Z"/>
  </g>
  <text x="176" y="146" font-size="11" fill="#dc2626">张裂 ←</text>
  <text x="366" y="146" font-size="11" fill="#dc2626">→ 张裂</text>

  <g stroke="#7c3aed" stroke-width="2.5" fill="#7c3aed">
    <line x1="424" y1="196" x2="424" y2="176"/><path d="M 419 176 L 424 168 L 429 176 Z"/>
    <line x1="424" y1="214" x2="424" y2="234"/><path d="M 419 234 L 424 242 L 429 234 Z"/>
  </g>
  <text x="432" y="190" font-size="11" fill="#7c3aed">↑ 碰撞挤压</text>

  <!-- 两大火山地震带 -->
  <rect x="52" y="72" width="616" height="302" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="7 6"/>
  <text x="60" y="392" font-size="12" fill="#dc2626">红色虚线：环太平洋火山地震带（示意）</text>
  <text x="360" y="392" font-size="12" fill="#dc2626">地中海—喜马拉雅火山地震带横贯亚欧大陆南部（示意）</text>

  <g font-size="13" fill="#1f2937">
    <text x="24" y="420">板块内部地壳比较稳定；板块交界处地壳活跃，多火山、地震。张裂拉伸 → 裂谷或海洋（红海扩大、东非大裂谷）；</text>
    <text x="24" y="442">碰撞挤压 → 山脉隆起或海洋缩小（喜马拉雅山升高、地中海缩小）。太平洋板块几乎全部是海洋。</text>
    <text x="24" y="466" fill="#6b7280">魏格纳提出大陆漂移假说；喜马拉雅山发现海洋生物化石、我国东部海底发现古河道，都是海陆变迁的证据。</text>
  </g>
</svg>
