<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="初一上期中考试在线复习站：生物、历史、道法、地理四科知识点、填空自测、选择题刷题、识图速查与抽背卡片。">
<title>初一上 · 期中在线复习</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/" id="brandLink"><span class="brand-mark">📚</span><span>初一上 · 期中在线复习</span></a>
  <div class="top-actions">
    <button class="icon-btn" id="searchBtn" title="全站搜索" aria-label="全站搜索">🔍 <span>搜索</span></button>
    <button class="icon-btn" id="themeBtn" title="切换深浅色" aria-label="切换深浅色">🌙</button>
    <a class="icon-btn" id="githubLink" href="#" target="_blank" rel="noopener" title="在 GitHub 查看源码" aria-label="GitHub">GH</a>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="footer">
  <p>生物 / 历史 / 道法整理自厦外 2026-2027 学年七上期中复习资料；地理按湘教版 2024 版教材自主整理（非校内原卷，示意图为自制） · 仅作个人复习使用，答案以老师课堂讲授为准</p>
  <p>纯静态页面，无需联网；复习进度保存在本机浏览器（localStorage）</p>
</footer>

<button id="backTop" class="back-top" aria-label="回到顶部" title="回到顶部">↑</button>

<div id="searchOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="全站搜索">
  <div class="overlay-panel search-panel">
    <div class="overlay-head">
      <input id="searchInput" type="search" placeholder="搜索知识点、题目、答案…" autocomplete="off">
      <button class="icon-btn" id="searchClose" aria-label="关闭">✕</button>
    </div>
    <div id="searchResults" class="search-results"><p class="muted">输入关键词，例如「显微镜」「分封制」「友谊」「经纬网」。</p></div>
  </div>
</div>

<div id="focusOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="抽背卡片">
  <div class="overlay-panel focus-panel">
    <div class="overlay-head"><strong id="focusTitle">抽背</strong><button class="icon-btn" id="focusClose" aria-label="关闭">✕</button></div>
    <div id="focusBody" class="focus-body"></div>
    <div class="focus-actions">
      <button class="btn ghost" id="focusPrev">上一张</button>
      <button class="btn primary" id="focusReveal">显示答案</button>
      <button class="btn ghost" id="focusNext">下一张</button>
    </div>
  </div>
</div>

<script src="data/bio.js"></script>
<script src="data/his.js"></script>
<script src="data/df.js"></script>
<script src="data/geo.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
